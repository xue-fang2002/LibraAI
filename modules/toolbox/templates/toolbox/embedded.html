<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线工具</title>
  <link rel="stylesheet" href="/static/toolbox/style.css">
  <link rel="stylesheet" href="/static/toolbox/workspace.css">
  <link rel="stylesheet" href="/static/toolbox/ai_assistant.css">
</head>
<body style="margin:0;background:transparent;">
  <div class="toolbox-page" id="toolbox-app">
    <!-- 一级分类 Tab 栏 -->
    <div class="tb-category-bar" id="category-bar">
      <!-- JS 动态渲染 -->
    </div>

    <!-- 二级分类 Pill 栏 -->
    <div class="tb-sub-bar" id="sub-bar">
      <!-- JS 动态渲染 -->
    </div>

    <!-- 内容区 -->
    <div class="tb-content-wrapper" id="content-area">
      <!-- JS 动态渲染工具面板 -->
    </div>
  </div>

  <!-- 配置文件（说明文本在此） -->
  <script src="/static/toolbox/tools-config.js"></script>
  <!-- 组件 -->
  <script src="/static/toolbox/components/upload-zone.js"></script>
  <script src="/static/toolbox/components/file-list.js"></script>
  <script src="/static/toolbox/components/progress-bar.js"></script>
  <script src="/static/toolbox/components/result-panel.js"></script>
  <!-- 工作区（持久文件池） -->
  <script src="/static/toolbox/workspace.js"></script>
  <!-- AI 工具助手 -->
  <script src="/static/toolbox/ai_assistant.js"></script>
  <!-- 纯前端计算工具面板（计算换算分类） -->
  <script src="/static/toolbox/calc-tools.js"></script>
  <!-- 核心逻辑 -->
  <script src="/static/toolbox/app.js"></script>
</body>
</html>
